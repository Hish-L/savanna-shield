name = "savanna-relay"
main = "worker.ts"
compatibility_date = "2026-11-01"

[vars]
# Sites allowed to open a room (localhost is always allowed for development).
ALLOWED_ORIGINS = "https://hish-l.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones included in the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
